[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mimar"
version = "0.1.0"
description = "A security architecture tool. Describe a system as trust zones, components, and data flows, and get its threat model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SiteQ8" }]
keywords = ["security", "threat-modeling", "stride", "architecture", "appsec", "cli", "zero-dependency"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/Mimar"
Repository = "https://github.com/SiteQ8/Mimar"

[project.scripts]
mimar = "mimar.cli:main"

[tool.setuptools.packages.find]
include = ["mimar*"]
